[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumpost"
version = "1.0.0"
description = "Post-quantum cryptography (FIPS 203 ML-KEM, FIPS 204 ML-DSA) in pure Python, with no dependencies"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
    "post-quantum",
    "cryptography",
    "ml-kem",
    "ml-dsa",
    "kyber",
    "dilithium",
    "fips-203",
    "fips-204",
    "lattice",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]
# Deliberately empty: the whole point is that this needs nothing else.
dependencies = []

[project.scripts]
quantumpost = "quantumpost.cli:main"

[project.urls]
Homepage = "https://github.com/iamsandeshdhital/QuantumPost"
Repository = "https://github.com/iamsandeshdhital/QuantumPost"
Issues = "https://github.com/iamsandeshdhital/QuantumPost/issues"

[tool.setuptools]
packages = ["quantumpost"]

[tool.setuptools.package-data]
quantumpost = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
ignore_missing_imports = true